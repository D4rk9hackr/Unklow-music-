name: Unklon Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for this release (optional, uses build.gradle.kts value otherwise)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release Unklon APKs
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | tr -d ' ' | cut -d= -f2)
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Extracted versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Restore Release Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p keystore
            echo "$KEYSTORE" | base64 -d > keystore/release.keystore
            echo "Keystore restored to keystore/release.keystore"
          else
            echo "::warning::KEYSTORE secret not set; APKs will be unsigned"
          fi

      - name: Build Unklon Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew \
            assembleUniversalFossRelease \
            assembleUniversalGmsRelease \
            assembleArm64FossRelease \
            assembleArm64GmsRelease \
            assembleArmeabiFossRelease \
            assembleArmeabiGmsRelease \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          variant=0
          for flavor in universal arm64 armeabi; do
            for type in foss gms; do
              out="app/build/outputs/apk/${flavor}${type^}/release/app-${flavor}-${type}-release.apk"
              # AGP output name varies; fall back to glob
              src=$(ls app/build/outputs/apk/${flavor}${type^}/release/*.apk 2>/dev/null | grep -v unsigned | head -1)
              if [ -n "$src" ]; then
                cp "$src" "release_assets/unklon-${flavor}-${type}-release.apk"
              else
                echo "::warning::APK not found for ${flavor}-${type}"
              fi
            done
          done

      - name: Create GitHub Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE="${{ steps.version_info.outputs.version_code }}"
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          TAG="v$VERSION_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to it"
            gh release upload "$TAG" release_assets/* --clobber
          else
            gh release create "$TAG" release_assets/* \
              --title "Unklon v$VERSION_NAME" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
          echo "Release ready: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"